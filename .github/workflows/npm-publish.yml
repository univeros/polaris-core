# Publishes @polaris-auth/client to npm on every v* tag through trusted publishing (OIDC): no npm token
# anywhere. The publisher is configured once on the package's settings page on npmjs.com (repository
# univeros/polaris-core, workflow file npm-publish.yml); npm attaches provenance because the repository
# and the package are public. The package version must equal the tag, as the release PR sets it.

name: Publish the client to npm

on:
  push:
    tags: ['v*']

jobs:
  publish:
    name: '@polaris-auth/client'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node (npm 11.5.1 or later is required for trusted publishing)
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: npm
          cache-dependency-path: packages/client-ts/package-lock.json

      - name: The package version is the tag
        working-directory: packages/client-ts
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::package.json is $version but the tag is ${GITHUB_REF_NAME}"
            exit 1
          fi

      - name: Build and publish
        working-directory: packages/client-ts
        run: |
          npm ci
          npm run build
          npm publish --access public
