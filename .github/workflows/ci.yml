name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  qa:
    name: QA (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: polaris_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Persistence tests run against a real driver (Postgres), never SQLite.
      DB_CONNECTION: postgres
      DB_DATABASE: polaris_test
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: openssl, sodium, gd, mbstring, pdo_pgsql, pgsql, pdo_sqlite, sqlite3
          coverage: none

      - name: Validate composer.json (root and packages)
        run: |
          composer validate --strict
          for pkg in packages/*/composer.json; do composer validate --strict --no-check-lock "$pkg"; done

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Coding standard (phpcs)
        run: composer cs

      - name: Static analysis (phpstan)
        run: composer stan

      - name: Forbidden imports (Altair, Cycle, Univeros; framework namespaces outside their adapter)
        run: composer imports

      - name: Tests (phpunit)
        run: composer test

      - name: Functional suite and contract fixtures through Laravel's kernel
        run: composer test:laravel

      - name: Functional suite and contract fixtures through Symfony's kernel
        run: composer test:symfony

      - name: Functional suite and contract fixtures through the Yii application
        run: composer test:yii

  demo:
    name: Slim demo walkthrough
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: openssl, sodium, gd, mbstring, pdo_sqlite, sqlite3
          coverage: none

      - name: Install the demo
        working-directory: examples/slim
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Set up and run the walkthrough
        working-directory: examples/slim
        run: |
          bin/setup
          bin/walkthrough.sh

  demo-laravel:
    name: Laravel demo walkthrough
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: openssl, sodium, gd, mbstring, pdo_sqlite, sqlite3
          coverage: none

      - name: Install the demo
        working-directory: examples/laravel
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Set up and run the walkthrough
        working-directory: examples/laravel
        run: |
          bin/setup
          bin/walkthrough.sh

  demo-symfony:
    name: Symfony demo walkthrough
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: openssl, sodium, gd, mbstring, pdo_sqlite, sqlite3
          coverage: none

      - name: Install the demo
        working-directory: examples/symfony
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Set up and run the walkthrough
        working-directory: examples/symfony
        run: |
          bin/setup
          bin/walkthrough.sh

  demo-yii:
    name: Yii demo walkthrough
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: openssl, sodium, gd, mbstring, pdo_sqlite, sqlite3
          coverage: none

      - name: Install the demo
        working-directory: examples/yii
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Set up and run the walkthrough
        working-directory: examples/yii
        run: |
          bin/setup
          bin/walkthrough.sh

  client-ts:
    name: TypeScript client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: openssl, sodium, gd, mbstring, pdo_sqlite, sqlite3
          coverage: none

      - name: Install the monorepo (bin/polaris renders the manifest)
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install and set up the Slim demo (the smoke test runs against it)
        working-directory: examples/slim
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          bin/setup

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: packages/client-ts/package-lock.json

      - name: Generate, drift-check, typecheck and test the client
        working-directory: packages/client-ts
        run: |
          npm ci
          npm run generate
          git diff --exit-code -- openapi.json src/schema.d.ts
          npm run typecheck
          npm test
