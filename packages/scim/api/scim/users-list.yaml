# GET /scim/v2/{connectionId}/Users: List SCIM users.
endpoint:
  method: GET
  path: /scim/v2/{connectionId}/Users
  summary: List SCIM users
  tags: [scim]
  auth: public   # the scim middleware resolves the connection token
  effect: read
  receipt: false

input:
  source: query
  fields:
    filter: { type: "?string", rules: [optional] }
    startIndex: { type: "?integer", rules: [optional] }
    count: { type: "?integer", rules: [optional] }

domain:
  class: Polaris\Scim\Http\Resources\ListUsersEndpoint
  description: >
    The organization's members as SCIM Users: userName and the primary email are the email, active the account status, groups the roles. filter takes attr eq|co|sw "value" joined by and (userName, emails, externalId, displayName); startIndex is 1-based, count at most 200.

output:
  status: 200
  example: {}

errors:
  - { status: 401, code: scim_error }
  - { status: 404, code: scim_error }
  - { status: 400, code: scim_invalidFilter }
events: []
