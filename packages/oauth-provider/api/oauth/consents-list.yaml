# GET /oauth2/consents: the clients the caller granted scopes to.
endpoint:
  method: GET
  path: /oauth2/consents
  summary: List your consents
  tags: [oauth]
  auth: bearer
  effect: read
  receipt: false

input:
  source: none

domain:
  class: Polaris\OAuth\Http\ConsentsListEndpoint
  description: >
    Every client the caller approved, with the scopes granted so far and when.

output:
  status: 200
  example:
    data:
      - { id: "018f...", client_id: "pcl_...", organization_id: null, scopes: [openid, org.read], granted_at: "2026-10-10T10:00:00+00:00", updated_at: "2026-10-10T10:00:00+00:00", client: { client_id: "pcl_...", name: "Acme CLI", logo_uri: null, client_uri: null, policy_uri: null, tos_uri: null, trusted: false } }

errors:
  - { status: 401, code: unauthorized }

events: []
