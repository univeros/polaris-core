# GET /oauth2/device/verify: what a user code stands for.
endpoint:
  method: GET
  path: /oauth2/device/verify
  summary: Read the device behind a user code
  tags: [oauth]
  auth: bearer
  effect: read
  receipt: false

input:
  source: query
  fields:
    user_code: { type: string, rules: [required] }

domain:
  class: Polaris\OAuth\Http\DeviceVerifyEndpoint
  description: >
    For the host's device page: the client and the scopes behind the code the signed-in user typed
    (dashes and case do not matter), so they can decide with POST /oauth2/device/approve.

output:
  status: 200
  example:
    data: { user_code: "BCDFGHJK", client: { client_id: "pcl_...", name: "Acme TV", logo_uri: null, client_uri: null, policy_uri: null, tos_uri: null, trusted: false }, scopes: [{ name: org.read, description: "View the organization profile" }], expires_at: "2026-10-10T10:30:00+00:00" }

errors:
  - { status: 401, code: unauthorized }
  - { status: 404, code: invalid_grant }

events: []
