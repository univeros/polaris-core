# GET /oauth2/ciba/pending: the caller's requests to decide.
endpoint:
  method: GET
  path: /oauth2/ciba/pending
  summary: List pending backchannel requests
  tags: [oauth]
  auth: bearer
  effect: read
  receipt: false

input:
  source: none

domain:
  class: Polaris\OAuth\Http\CibaPendingEndpoint
  description: >
    The backchannel requests addressed to the caller that are still pending, newest first, with the
    client behind each.

output:
  status: 200
  example:
    data:
      - { id: "018f...", client_id: "pcl_...", scopes: [org.read], binding_message: "Deploy to production?", status: pending, expires_at: "2026-10-10T10:10:00+00:00", created_at: "2026-10-10T10:00:00+00:00", client: { client_id: "pcl_...", name: "Acme bot", logo_uri: null, client_uri: null, policy_uri: null, tos_uri: null, trusted: false } }

errors:
  - { status: 401, code: unauthorized }

events: []
