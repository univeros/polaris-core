# POST /orgs/{id}/oauth/clients: register a client for the organization.
endpoint:
  method: POST
  path: /orgs/{id}/oauth/clients
  summary: Register an OAuth client for the organization
  tags: [oauth, orgs]
  auth: bearer
  requires_permissions: [org.update]
  effect: write
  receipt: true

input:
  source: body
  fields:
    name: { type: string, rules: [required, "max:160"] }
    type: { type: "?string", rules: [optional, "in:confidential,public"] }
    redirect_uris: { type: "?list<string>", rules: [optional] }
    grant_types: { type: "?list<string>", rules: [optional] }
    scopes: { type: "?list<string>", rules: [optional] }
    token_endpoint_auth_method: { type: "?string", rules: [optional] }
    jwks: { type: "?object", rules: [optional] }
    jwks_uri: { type: "?string", rules: [optional] }
    dpop_bound_access_tokens: { type: "?boolean", rules: [optional] }
    logo_uri: { type: "?string", rules: [optional] }
    client_uri: { type: "?string", rules: [optional] }
    policy_uri: { type: "?string", rules: [optional] }
    tos_uri: { type: "?string", rules: [optional] }

domain:
  class: Polaris\OAuth\Http\Organization\CreateClientEndpoint
  description: >
    A confidential (a secret, in this response only, or private_key_jwt) or public (PKCE, none) client:
    redirect_uris (https, or http on loopback, or a custom scheme), grant_types (authorization_code,
    refresh_token, client_credentials, device_code, ciba, token-exchange), scopes it may ask for (empty:
    any the server knows), DPoP binding. An organization's client is never trusted. Recorded as
    oauth.client_created.

output:
  status: 201
  example:
    data: { id: "018f...", client_id: "pcl_...", organization_id: "018f...", name: "Acme CLI", type: confidential, redirect_uris: ["https://cli.acme.example/callback"], grant_types: [authorization_code, refresh_token], scopes: [], token_endpoint_auth_method: client_secret_basic, jwks: null, jwks_uri: null, dpop_bound_access_tokens: false, trusted: false, logo_uri: null, client_uri: null, policy_uri: null, tos_uri: null, created_by: "018f...", disabled_at: null, created_at: "2026-10-10T10:00:00+00:00", updated_at: "2026-10-10T10:00:00+00:00", client_secret: "pcs_..." }

errors:
  - { status: 401, code: unauthorized }
  - { status: 403, code: forbidden }
  - { status: 403, code: oauth_forbidden }
  - { status: 400, code: invalid_client_metadata }

events: [oauth.client_created]
