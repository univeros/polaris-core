# GET /admin/oauth/clients: every client, for the operators.
endpoint:
  method: GET
  path: /admin/oauth/clients
  summary: List every OAuth client
  tags: [admin, oauth]
  auth: public   # the admin middleware resolves the principal (an admin user or an API key)
  effect: read
  receipt: false

input:
  source: none

domain:
  class: Polaris\OAuth\Http\Admin\AdminListClientsEndpoint
  description: >
    Every registered client the principal's scope covers (instance-wide, or one organization's).
    Needs read.

output:
  status: 200
  example:
    data:
      - { id: "018f...", client_id: "pcl_...", organization_id: null, name: "Acme CLI", type: confidential, redirect_uris: ["https://cli.acme.example/callback"], grant_types: [authorization_code, refresh_token], scopes: [], token_endpoint_auth_method: client_secret_basic, jwks: null, jwks_uri: null, dpop_bound_access_tokens: false, trusted: true, logo_uri: null, client_uri: null, policy_uri: null, tos_uri: null, created_by: "018f...", disabled_at: null, created_at: "2026-10-10T10:00:00+00:00", updated_at: "2026-10-10T10:00:00+00:00" }

errors:
  - { status: 401, code: admin_unauthorized }
  - { status: 403, code: admin_forbidden }

events: []
