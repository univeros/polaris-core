# PATCH /orgs/{id}/oauth/clients/{clientId}: change a client.
endpoint:
  method: PATCH
  path: /orgs/{id}/oauth/clients/{clientId}
  summary: Update an OAuth client of the organization
  tags: [oauth, orgs]
  auth: bearer
  requires_permissions: [org.update]
  effect: write
  receipt: true

input:
  source: body
  fields:
    name: { type: "?string", rules: [optional, "max:160"] }
    redirect_uris: { type: "?list<string>", rules: [optional] }
    grant_types: { type: "?list<string>", rules: [optional] }
    scopes: { type: "?list<string>", rules: [optional] }
    token_endpoint_auth_method: { type: "?string", rules: [optional] }
    jwks: { type: "?object", rules: [optional] }
    jwks_uri: { type: "?string", rules: [optional] }
    dpop_bound_access_tokens: { type: "?boolean", rules: [optional] }
    logo_uri: { type: "?string", rules: [optional] }
    client_uri: { type: "?string", rules: [optional] }
    policy_uri: { type: "?string", rules: [optional] }
    tos_uri: { type: "?string", rules: [optional] }
    disabled: { type: "?boolean", rules: [optional] }

domain:
  class: Polaris\OAuth\Http\Organization\UpdateClientEndpoint
  description: >
    A field left out keeps its value; disabled true stops the client at the token endpoint. Recorded as
    oauth.client_updated with what changed.

output:
  status: 200
  example:
    data: { id: "018f...", client_id: "pcl_...", organization_id: "018f...", name: "Acme CLI (renamed)", type: confidential, redirect_uris: ["https://cli.acme.example/callback"], grant_types: [authorization_code, refresh_token], scopes: [], token_endpoint_auth_method: client_secret_basic, jwks: null, jwks_uri: null, dpop_bound_access_tokens: false, trusted: false, logo_uri: null, client_uri: null, policy_uri: null, tos_uri: null, created_by: "018f...", disabled_at: null, created_at: "2026-10-10T10:00:00+00:00", updated_at: "2026-10-10T10:10:00+00:00" }

errors:
  - { status: 401, code: unauthorized }
  - { status: 403, code: forbidden }
  - { status: 403, code: oauth_forbidden }
  - { status: 404, code: oauth_not_found }
  - { status: 400, code: invalid_client_metadata }

events: [oauth.client_updated]
