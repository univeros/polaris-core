# GET /admin/organizations/{id}: read an organization.
endpoint:
  method: GET
  path: /admin/organizations/{id}
  summary: Read an organization
  tags: [admin, organizations]
  auth: public   # the admin middleware resolves the principal (an admin user or an API key)
  effect: read
  receipt: false

input:
  source: path
  fields:
    id: { type: string, rules: [required] }

domain:
  class: Polaris\Admin\Http\Organizations\ReadOrganizationEndpoint
  description: >
    The organization with its members and their roles. Needs read on the instance or on this
    organization.

output:
  status: 200
  example:
    data:
      id: "018f..."
      name: "Acme Rockets"
      slug: "acme-rockets"
      status: "active"
      created_by: "018f..."
      created_at: "2026-09-11T10:00:00+00:00"
      updated_at: "2026-09-11T10:00:00+00:00"
      members:
        - user_id: "018f..."
          email: "ada@example.com"
          display_name: "Ada"
          status: "active"
          roles: ["owner"]

errors:
  - { status: 401, code: admin_unauthorized }
  - { status: 403, code: admin_forbidden }
  - { status: 403, code: admin_impersonation_denied }
  - { status: 404, code: admin_not_found }

events: []
