# DELETE /admin/users/{id}/sessions: revoke every session.
endpoint:
  method: DELETE
  path: /admin/users/{id}/sessions
  summary: Revoke every session
  tags: [admin, sessions]
  auth: public   # the admin middleware resolves the principal (an admin user or an API key)
  effect: destructive
  receipt: true

input:
  source: path
  fields:
    id: { type: string, rules: [required] }

domain:
  class: Polaris\Admin\Http\Sessions\RevokeAllSessionsEndpoint
  description: >
    Ends every session of the user (reason admin). Needs support; recorded as
    admin.sessions_revoked.

output:
  status: 200
  example:
    data:
      status: "revoked"
      count: 2

errors:
  - { status: 401, code: admin_unauthorized }
  - { status: 403, code: admin_forbidden }
  - { status: 403, code: admin_impersonation_denied }
  - { status: 404, code: admin_not_found }

events: [admin.sessions_revoked]
