# POST /admin/users/{id}/password: set a user's password.
endpoint:
  method: POST
  path: /admin/users/{id}/password
  summary: Set a user's password
  tags: [admin, users]
  auth: public   # the admin middleware resolves the principal (an admin user or an API key)
  effect: write
  receipt: true

input:
  source: body
  fields:
    id: { type: string, rules: [required] }
    password: { type: string, rules: [required], sensitive: true }

domain:
  class: Polaris\Admin\Http\Users\SetPasswordEndpoint
  description: >
    The password policy applies (422 with errors); every session ends, as after a reset. Needs
    manage; recorded as admin.password_set.

output:
  status: 200
  example:
    data:
      status: "password_set"

errors:
  - { status: 401, code: admin_unauthorized }
  - { status: 403, code: admin_forbidden }
  - { status: 403, code: admin_impersonation_denied }
  - { status: 404, code: admin_not_found }
  - { status: 422, code: admin_invalid_input }

events: [user.password_changed, admin.password_set]
