# GET /admin/users/{id}/sessions: list a user's sessions.
endpoint:
  method: GET
  path: /admin/users/{id}/sessions
  summary: List a user's sessions
  tags: [admin, sessions]
  auth: public   # the admin middleware resolves the principal (an admin user or an API key)
  effect: read
  receipt: false

input:
  source: path
  fields:
    id: { type: string, rules: [required] }

domain:
  class: Polaris\Admin\Http\Sessions\ListSessionsEndpoint
  description: >
    The active sessions (refresh-token families), as GET /auth/sessions lists them for the user.
    Needs read.

output:
  status: 200
  example:
    data:
      - id: "018f..."
        current: false
        ip: "203.0.113.7"
        user_agent: "Mozilla/5.0"
        created_at: "2026-09-11T10:00:00+00:00"
        last_used_at: "2026-09-11T10:05:00+00:00"

errors:
  - { status: 401, code: admin_unauthorized }
  - { status: 403, code: admin_forbidden }
  - { status: 403, code: admin_impersonation_denied }
  - { status: 404, code: admin_not_found }

events: []
