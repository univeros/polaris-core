# GET /admin/organizations/{id}/drains: list an organization's audit drains.
endpoint:
  method: GET
  path: /admin/organizations/{id}/drains
  summary: List an organization's audit drains
  tags: [admin, audit]
  auth: public   # the admin middleware resolves the principal (an admin user or an API key)
  effect: read
  receipt: false

input:
  source: path
  fields:
    id: { type: string, rules: [required] }

domain:
  class: Polaris\Admin\Http\Audit\ListDrainsEndpoint
  description: >
    The drains, never their secrets. Needs read on the instance or on this organization.

output:
  status: 200
  example:
    data:
      - id: "018f..."
        organization_id: "018f..."
        type: "webhook"
        endpoint: "https://hooks.example.test/audit"
        filter: ["org.*"]
        status: "active"
        last_delivery_at: null
        last_error: null
        created_at: "2026-09-11T10:00:00+00:00"

errors:
  - { status: 401, code: admin_unauthorized }
  - { status: 403, code: admin_forbidden }
  - { status: 403, code: admin_impersonation_denied }
  - { status: 404, code: admin_not_found }

events: []
