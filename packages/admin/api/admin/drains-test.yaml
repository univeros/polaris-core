# POST /admin/organizations/{id}/drains/{drainId}/test: test an audit drain.
endpoint:
  method: POST
  path: /admin/organizations/{id}/drains/{drainId}/test
  summary: Test an audit drain
  tags: [admin, audit]
  auth: public   # the admin middleware resolves the principal (an admin user or an API key)
  effect: write
  receipt: true

input:
  source: path
  fields:
    id: { type: string, rules: [required] }
    drainId: { type: string, rules: [required] }

domain:
  class: Polaris\Admin\Http\Audit\TestDrainEndpoint
  description: >
    Records admin.drain_tested for the organization, delivered to its drains like any event, and
    answers the drain's state afterwards (last_delivery_at, last_error). Needs own.

output:
  status: 200
  example:
    data:
      id: "018f..."
      organization_id: "018f..."
      type: "webhook"
      endpoint: "https://hooks.example.test/audit"
      filter: ["org.*"]
      status: "active"
      last_delivery_at: null
      last_error: null
      created_at: "2026-09-11T10:00:00+00:00"

errors:
  - { status: 401, code: admin_unauthorized }
  - { status: 403, code: admin_forbidden }
  - { status: 403, code: admin_impersonation_denied }
  - { status: 404, code: admin_not_found }

events: [admin.drain_tested]
