# GET /admin/grants: list the admin grants.
endpoint:
  method: GET
  path: /admin/grants
  summary: List the admin grants
  tags: [admin, grants]
  auth: public   # the admin middleware resolves the principal (an admin user or an API key)
  effect: read
  receipt: false

input:
  source: none

domain:
  class: Polaris\Admin\Http\Grants\ListGrantsEndpoint
  description: >
    Needs own on the instance.

output:
  status: 200
  example:
    data:
      - id: "018f..."
        user_id: "018f..."
        role: "support"
        scope: "instance"
        granted_by: "018f..."
        expires_at: null
        created_at: "2026-09-11T10:00:00+00:00"

errors:
  - { status: 401, code: admin_unauthorized }
  - { status: 403, code: admin_forbidden }
  - { status: 403, code: admin_impersonation_denied }

events: []
