# DELETE /admin/grants/{id}: revoke an admin grant.
endpoint:
  method: DELETE
  path: /admin/grants/{id}
  summary: Revoke an admin grant
  tags: [admin, grants]
  auth: public   # the admin middleware resolves the principal (an admin user or an API key)
  effect: destructive
  receipt: true

input:
  source: path
  fields:
    id: { type: string, rules: [required] }

domain:
  class: Polaris\Admin\Http\Grants\DeleteGrantEndpoint
  description: >
    Needs own on the instance; recorded as admin.grant_deleted.

output:
  status: 200
  example:
    data:
      status: "deleted"

errors:
  - { status: 401, code: admin_unauthorized }
  - { status: 403, code: admin_forbidden }
  - { status: 403, code: admin_impersonation_denied }
  - { status: 404, code: admin_not_found }

events: [admin.grant_deleted]
