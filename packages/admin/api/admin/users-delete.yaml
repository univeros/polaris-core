# DELETE /admin/users/{id}: delete a user.
endpoint:
  method: DELETE
  path: /admin/users/{id}
  summary: Delete a user
  tags: [admin, users]
  auth: public   # the admin middleware resolves the principal (an admin user or an API key)
  effect: destructive
  receipt: true

input:
  source: path
  fields:
    id: { type: string, rules: [required] }

domain:
  class: Polaris\Admin\Http\Users\DeleteUserEndpoint
  description: >
    Anonymises the account as core's erasure does (tombstone row, factors and challenges
    scrubbed, sessions ended); deleting yourself is refused. Needs manage; recorded as
    admin.user_deleted.

output:
  status: 200
  example:
    data:
      status: "deleted"

errors:
  - { status: 401, code: admin_unauthorized }
  - { status: 403, code: admin_forbidden }
  - { status: 403, code: admin_impersonation_denied }
  - { status: 404, code: admin_not_found }
  - { status: 409, code: admin_conflict }

events: [user.deleted, admin.user_deleted]
