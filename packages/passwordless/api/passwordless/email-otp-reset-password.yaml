# POST /email-otp/reset-password: a new password with an email code.
endpoint:
  method: POST
  path: /email-otp/reset-password
  summary: Reset the password with an email code
  tags: [passwordless]
  auth: public
  rate_limit: token_consume
  effect: write
  receipt: true

input:
  source: body
  fields:
    email: { type: string, rules: [required, email, "max:320"] }
    code: { type: string, rules: [required], sensitive: true }
    password: { type: string, rules: [required], sensitive: true }

domain:
  class: Polaris\Passwordless\Http\EmailOtpResetPasswordEndpoint
  description: >
    The code alternative to core's POST /auth/password/reset (which stays as it is): the password must
    pass core's policy (a refused password keeps the code), then the reset-password code is spent, the
    password set, a lockout lifted and every session ended.

output:
  status: 200
  example:
    data: { status: password_reset }

errors:
  - { status: 422, code: passwordless_code_invalid }
  - { status: 422, code: passwordless_invalid_input }
  - { status: 422, code: passwordless_password_invalid }

events: [user.password_changed]
