# GET /magic-link/verify: the link from the email.
endpoint:
  method: GET
  path: /magic-link/verify
  summary: Open a magic link
  tags: [passwordless]
  auth: public
  rate_limit: token_consume
  effect: write
  receipt: false

input:
  source: query
  fields:
    token: { type: string, rules: [required], sensitive: true }

domain:
  class: Polaris\Passwordless\Http\MagicLinkVerifyEndpoint
  description: >
    Spends the link's token, signs the user in (signing up an unknown address when sign-up is on;
    core's MFA gate applies) and redirects (302) to the redirect_uri with a code, valid once for 60
    seconds, for POST /magic-link/exchange. An unknown, used or expired token answers a problem
    document instead, since its redirect target is not known.

output:
  status: 302
  example: {}

errors:
  - { status: 403, code: passwordless_account_disabled }
  - { status: 422, code: passwordless_invalid_input }
  - { status: 422, code: passwordless_token_invalid }

events: [user.logged_in]
