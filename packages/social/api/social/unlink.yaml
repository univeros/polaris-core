# DELETE /social/{provider}: unlink a provider from the caller's account.
endpoint:
  method: DELETE
  path: /social/{provider}
  summary: Unlink a provider
  tags: [social]
  auth: bearer
  step_up: true
  effect: destructive
  receipt: true

input:
  source: path
  fields:
    provider: { type: string, rules: [required] }

domain:
  class: Polaris\Social\Http\UnlinkEndpoint
  description: >
    Removes the link and the provider tokens. Refused when it is the only way into the account (no
    password and no other provider): social_last_credential. Step-up gated.

output:
  status: 200
  example:
    data: { status: unlinked }

errors:
  - { status: 401, code: unauthorized }
  - { status: 401, code: step_up_required }
  - { status: 404, code: social_not_linked }
  - { status: 409, code: social_last_credential }

events: []
