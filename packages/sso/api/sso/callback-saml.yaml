# POST /sso/callback/{providerId}: the SAML response (POST binding).
endpoint:
  method: POST
  path: /sso/callback/{providerId}
  summary: SAML assertion consumer
  tags: [sso]
  auth: public
  effect: write
  receipt: false

input:
  source: body
  fields:
    SAMLResponse: { type: "?string", rules: [optional] }
    RelayState: { type: "?string", rules: [optional] }

domain:
  class: Polaris\Sso\Http\Flow\SamlCallbackEndpoint
  description: >
    Validates the response (signature, audience, destination, InResponseTo unless the provider allows
    IdP-initiated sign-in, conditions, replay), resolves or provisions the user, ensures the membership,
    opens an organization-scoped session and sends the browser to the application's redirect_uri with
    sso_code. Rejections are sso/assertion_invalid; the reason is in the audit trail.

output:
  status: 302
  example: {}

errors:
  - { status: 403, code: sso_assertion_invalid }
  - { status: 403, code: sso_user_unknown }
  - { status: 403, code: sso_account_disabled }
  - { status: 403, code: sso_membership_suspended }
  - { status: 403, code: sso_provider_disabled }
  - { status: 404, code: sso_provider_not_found }

events: [sso.signed_in, sso.assertion_rejected]
