# GET /admin/sso/providers: every organization's providers, for the operators.
endpoint:
  method: GET
  path: /admin/sso/providers
  summary: List the SSO providers of every organization
  tags: [admin, sso]
  auth: public   # the admin middleware resolves the principal (an admin user or an API key)
  effect: read
  receipt: false

input:
  source: query
  fields:
    organization_id: { type: "?string", rules: [optional] }
    cursor: { type: "?string", rules: [optional] }
    limit: { type: integer, rules: [optional] }

domain:
  class: Polaris\Sso\Http\Admin\AdminListProvidersEndpoint
  description: >
    Oldest first, cursor-paginated, never the secrets; an organization-scoped operator sees their
    organization's. Needs read.

output:
  status: 200
  example:
    data:
      - id: "018f..."
        organization_id: "018f..."
        type: "oidc"
        name: "Okta"
        enabled: true
    next_cursor: null

errors:
  - { status: 401, code: admin_unauthorized }
  - { status: 403, code: admin_forbidden }
  - { status: 403, code: admin_impersonation_denied }
  - { status: 422, code: admin_invalid_input }

events: []
