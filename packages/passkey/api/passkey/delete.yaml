# DELETE /passkey/{id}: remove a passkey.
endpoint:
  method: DELETE
  path: /passkey/{id}
  summary: Remove a passkey
  tags: [passkey]
  auth: bearer
  step_up: true
  effect: destructive
  receipt: true

input:
  source: path
  fields:
    id: { type: string, rules: [required] }

domain:
  class: Polaris\Passkey\Http\DeleteEndpoint
  description: >
    Removes the passkey and the core factor it backs, with core's rule: the last confirmed factor of a
    user whose MFA is enforced stays (passkey_last_factor). Step-up gated like core's factor removal.

output:
  status: 200
  example:
    data: { status: deleted }

errors:
  - { status: 401, code: unauthorized }
  - { status: 401, code: step_up_required }
  - { status: 404, code: passkey_not_found }
  - { status: 409, code: passkey_last_factor }

events: [mfa.factor_removed]
