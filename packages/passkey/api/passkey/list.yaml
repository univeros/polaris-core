# GET /passkey/list: the caller's passkeys.
endpoint:
  method: GET
  path: /passkey/list
  summary: List your passkeys
  tags: [passkey]
  auth: bearer
  effect: read
  receipt: false

input:
  source: none

domain:
  class: Polaris\Passkey\Http\ListEndpoint
  description: >
    Every passkey of the caller: its name, the authenticator's aaguid and transports, whether it is backed
    up (synced), the core factor it backs, when it was last used.

output:
  status: 200
  example:
    data:
      - { id: "018f...", name: "MacBook", aaguid: "<uuid>", transports: [internal, hybrid], backed_up: true, factor_id: "018f...", last_used_at: "2026-10-09T10:05:00+00:00", created_at: "2026-10-09T10:00:00+00:00" }

errors:
  - { status: 401, code: unauthorized }

events: []
