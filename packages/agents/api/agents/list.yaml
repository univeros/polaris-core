# GET /agents: the caller's agents.
endpoint:
  method: GET
  path: /agents
  summary: List my agents
  tags: [agents]
  auth: bearer
  effect: read
  receipt: false

input:
  source: none

domain:
  class: Polaris\Agents\Http\ListAgentsEndpoint
  description: >
    The caller's own agents, and their active organization's when they hold org.update in it.

output:
  status: 200
  example:
    data: [{ id: "018f...", owner_type: user, owner_id: "018f...", organization_id: "018f...", name: "Deploy bot", mode: autonomous, host_id: null, auth: private_key_jwt, public_jwk: { kty: EC, crv: P-256, x: "...", y: "...", alg: ES256, kid: "...", use: sig }, status: active, created_by: "018f...", sealed_at: null, created_at: "2026-10-10T10:00:00+00:00", updated_at: "2026-10-10T10:00:00+00:00" }]

errors:
  - { status: 401, code: unauthorized }

events: []
