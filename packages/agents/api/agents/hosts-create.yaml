# POST /agents/hosts: create a host.
endpoint:
  method: POST
  path: /agents/hosts
  summary: Create a host
  tags: [agents]
  auth: bearer
  effect: write
  receipt: true

input:
  source: body
  fields:
    name: { type: string, rules: [required, "max:160"] }
    organization_id: { type: "?string", rules: [optional] }
    default_capabilities: { type: "?list<string>", rules: [optional] }

domain:
  class: Polaris\Agents\Http\CreateHostEndpoint
  description: >
    A runtime that enrols agents (a Claude Code install, a worker) for the caller, or for an organization
    they hold org.update in (their active one). The enrolment token (peh_...) is in this response only
    and stored as a keyed hash; default_capabilities are asked for by every agent it enrols.

output:
  status: 201
  example:
    data: { id: "018f...", owner_type: user, owner_id: "018f...", organization_id: "018f...", name: "Laptop", default_capabilities: ["deploy.staging"], created_by: "018f...", revoked_at: null, created_at: "2026-10-10T10:00:00+00:00", enrollment_token: "peh_..." }

errors:
  - { status: 401, code: unauthorized }
  - { status: 403, code: agents_forbidden }
  - { status: 404, code: capability_not_found }
  - { status: 422, code: agents_invalid_input }

events: []
