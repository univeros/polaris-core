# GET /agents/{id}: one agent with its grants.
endpoint:
  method: GET
  path: /agents/{id}
  summary: Read an agent
  tags: [agents]
  auth: bearer
  effect: read
  receipt: false

input:
  source: path
  fields:
    id: { type: string, rules: [required] }

domain:
  class: Polaris\Agents\Http\ShowAgentEndpoint
  description: >
    An agent the caller manages (their own, or their active organization's with org.update), with every
    grant it has or had.

output:
  status: 200
  example:
    data: { id: "018f...", owner_type: user, owner_id: "018f...", organization_id: "018f...", name: "Deploy bot", mode: autonomous, host_id: null, auth: private_key_jwt, public_jwk: null, status: active, created_by: "018f...", sealed_at: null, created_at: "2026-10-10T10:00:00+00:00", updated_at: "2026-10-10T10:00:00+00:00", grants: [{ id: "018f...", agent_id: "018f...", capability: "deploy.staging", constraints: {}, budget: { kind: count, total: 100, remaining: 100, field: null }, status: active, granted_by: null, approved_via: auto, approval_id: null, expires_at: null, created_at: "2026-10-10T10:00:00+00:00", updated_at: "2026-10-10T10:00:00+00:00" }] }

errors:
  - { status: 401, code: unauthorized }
  - { status: 404, code: agents_not_found }

events: []
