# GET /agents/receipts/{id}/verify: verify a receipt.
endpoint:
  method: GET
  path: /agents/receipts/{id}/verify
  summary: Verify a receipt
  tags: [agents]
  auth: bearer
  effect: read
  receipt: false

input:
  source: path
  fields:
    id: { type: string, rules: [required] }

domain:
  class: Polaris\Agents\Http\VerifyReceiptEndpoint
  description: >
    Recomputes the hash over the canonical JSON of the receipt's fields, verifies the signature (a
    receipt+jwt JWS) with core's public key, and checks prev_hash against the previous receipt of the
    chain. For the agent's owner, or the agent itself with its access token.

output:
  status: 200
  example:
    data: { valid: true, checks: { hash: true, signature: true, chain: true }, receipt: { id: "018f...", agent_id: "018f...", seq: 1, grant_id: "018f...", capability: "deploy.staging", input_hash: "9f86...", outcome: success, budget_before: 100, budget_after: 99, prev_hash: null, hash: "2c26...", signature: "<jwt>", created_at: "2026-10-10T10:00:00+00:00" } }

errors:
  - { status: 401, code: unauthorized }
  - { status: 404, code: agents_not_found }

events: []
