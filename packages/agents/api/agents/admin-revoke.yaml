# POST /admin/agents/{id}/revoke: an operator pulls the kill switch.
endpoint:
  method: POST
  path: /admin/agents/{id}/revoke
  summary: Revoke an agent as an operator
  tags: [admin, agents]
  auth: public   # the admin middleware resolves the principal (an admin user or an API key)
  effect: destructive
  receipt: true

input:
  source: path
  fields:
    id: { type: string, rules: [required] }

domain:
  class: Polaris\Agents\Http\Admin\AdminRevokeAgentEndpoint
  description: >
    The same kill switch as the owner's: tokens, grants and approvals ended, the chain sealed. Needs own
    on the agent's organization (or the instance). Recorded as agent.revoked and agent.receipt.sealed.

output:
  status: 200
  example:
    data: { id: "018f...", owner_type: organization, owner_id: "018f...", organization_id: "018f...", name: "Deploy bot", mode: autonomous, host_id: null, auth: client_secret, public_jwk: null, status: revoked, created_by: "018f...", sealed_at: "2026-10-10T10:00:00+00:00", created_at: "2026-10-10T10:00:00+00:00", updated_at: "2026-10-10T10:00:00+00:00", sealed_receipt: { id: "018f...", agent_id: "018f...", seq: 1, grant_id: "018f...", capability: "deploy.staging", input_hash: "9f86...", outcome: success, budget_before: 100, budget_after: 99, prev_hash: null, hash: "2c26...", signature: "<jwt>", created_at: "2026-10-10T10:00:00+00:00" } }

errors:
  - { status: 401, code: admin_unauthorized }
  - { status: 403, code: admin_forbidden }
  - { status: 404, code: admin_not_found }
  - { status: 409, code: admin_conflict }

events: [agent.revoked, agent.receipt.sealed]
