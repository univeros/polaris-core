# GET /agents/hosts: the caller's hosts.
endpoint:
  method: GET
  path: /agents/hosts
  summary: List my hosts
  tags: [agents]
  auth: bearer
  effect: read
  receipt: false

input:
  source: none

domain:
  class: Polaris\Agents\Http\ListHostsEndpoint
  description: >
    The caller's live hosts, and their active organization's when they hold org.update in it.

output:
  status: 200
  example:
    data:
      - { id: "018f...", owner_type: user, owner_id: "018f...", organization_id: "018f...", name: "Laptop", default_capabilities: ["deploy.staging"], created_by: "018f...", revoked_at: null, created_at: "2026-10-10T10:00:00+00:00" }

errors:
  - { status: 401, code: unauthorized }

events: []
