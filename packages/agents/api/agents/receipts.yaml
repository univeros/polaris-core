# GET /agents/{id}/receipts: the receipt chain.
endpoint:
  method: GET
  path: /agents/{id}/receipts
  summary: List an agent's receipts
  tags: [agents]
  auth: bearer
  effect: read
  receipt: false

input:
  source: query
  fields:
    id: { type: string, rules: [required] }
    after: { type: "?integer", rules: [optional] }
    limit: { type: "?integer", rules: [optional] }

domain:
  class: Polaris\Agents\Http\ListReceiptsEndpoint
  description: >
    The chain oldest first, after a sequence number, at most limit (100, up to 200) receipts; next_cursor
    is the last sequence number of the page. Exportable as a chain: each receipt carries its hash, the
    previous one's and a signature verifiable with core's JWKS.

output:
  status: 200
  example:
    data: [{ id: "018f...", agent_id: "018f...", seq: 1, grant_id: "018f...", capability: "deploy.staging", input_hash: "9f86...", outcome: success, budget_before: 100, budget_after: 99, prev_hash: null, hash: "2c26...", signature: "<jwt>", created_at: "2026-10-10T10:00:00+00:00" }]
    next_cursor: 1
    has_more: false

errors:
  - { status: 401, code: unauthorized }
  - { status: 404, code: agents_not_found }

events: []
