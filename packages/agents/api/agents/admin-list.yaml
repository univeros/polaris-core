# GET /admin/agents: every agent, for the operators.
endpoint:
  method: GET
  path: /admin/agents
  summary: List every agent
  tags: [admin, agents]
  auth: public   # the admin middleware resolves the principal (an admin user or an API key)
  effect: read
  receipt: false

input:
  source: none

domain:
  class: Polaris\Agents\Http\Admin\AdminListAgentsEndpoint
  description: >
    Every agent the principal's scope covers (instance-wide, or one organization's). Needs read.

output:
  status: 200
  example:
    data: [{ id: "018f...", owner_type: user, owner_id: "018f...", organization_id: "018f...", name: "Deploy bot", mode: autonomous, host_id: null, auth: private_key_jwt, public_jwk: { kty: EC, crv: P-256, x: "...", y: "...", alg: ES256, kid: "...", use: sig }, status: active, created_by: "018f...", sealed_at: null, created_at: "2026-10-10T10:00:00+00:00", updated_at: "2026-10-10T10:00:00+00:00" }]

errors:
  - { status: 401, code: admin_unauthorized }
  - { status: 403, code: admin_forbidden }

events: []
