# POST /agents/{id}/resume
endpoint:
  method: POST
  path: /agents/{id}/resume
  summary: Resume an agent
  tags: [agents]
  auth: bearer
  effect: write
  receipt: true

input:
  source: path
  fields:
    id: { type: string, rules: [required] }

domain:
  class: Polaris\Agents\Http\ResumeEndpoint
  description: >
    A suspended agent acts again. A revoked agent cannot be resumed. Recorded as agent.resumed.

output:
  status: 200
  example:
    data: { id: "018f...", owner_type: user, owner_id: "018f...", organization_id: "018f...", name: "Deploy bot", mode: autonomous, host_id: null, auth: private_key_jwt, public_jwk: null, status: active, created_by: "018f...", sealed_at: null, created_at: "2026-10-10T10:00:00+00:00", updated_at: "2026-10-10T10:00:00+00:00" }

errors:
  - { status: 401, code: unauthorized }
  - { status: 404, code: agents_not_found }
  - { status: 409, code: agents_conflict }

events: [agent.resumed]
