# GET /admin/sentinel/ip-rules: the allow and block rules.
endpoint:
  method: GET
  path: /admin/sentinel/ip-rules
  summary: List the IP rules
  tags: [admin, sentinel]
  auth: public   # the admin middleware resolves the principal (an admin user or an API key)
  effect: read
  receipt: false

input:
  source: none

domain:
  class: Polaris\Sentinel\Http\Admin\ListIpRulesEndpoint
  description: >
    Every rule in creation order, which is the order they match in. Needs read on the instance.

output:
  status: 200
  example:
    data:
      - id: "018f..."
        cidr: "203.0.113.0/24"
        action: "block"
        note: "scanner"
        created_by: "018f..."
        created_at: "2026-09-11T10:00:00+00:00"

errors:
  - { status: 401, code: admin_unauthorized }
  - { status: 403, code: admin_forbidden }
  - { status: 403, code: admin_impersonation_denied }

events: []
