<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Approve an agent</title>
  <style>
    body { font: 16px/1.5 system-ui, sans-serif; max-width: 32rem; margin: 3rem auto; padding: 0 1rem; color: #222; }
    button { font: inherit; padding: .5rem 1rem; margin-right: .5rem; }
    input { font: inherit; padding: .4rem; }
    ul { padding-left: 1.25rem; }
    .muted { color: #666; }
  </style>
</head>
<body>
  <!--
    The reference agent approval page (polaris/agents, device_authorization): the agent shows its user
    code (or sends the person to ?user_code=...); the page signs the person in when it has no session,
    loads the approval behind the code (GET /agents/approvals/code?user_code=) and posts the decision
    (POST /agents/approvals/{id}/decide). Replace it with your own page; the two calls are the contract.
  -->
  <h1>Approve an agent?</h1>
  <form id="code" hidden>
    <label>Code <input id="user_code" placeholder="BCDF-GHJK" required autocomplete="off"></label>
    <button>Look up</button>
  </form>
  <p id="agent" class="muted" hidden></p>
  <ul id="grants"></ul>
  <p id="actions" hidden>
    <button id="approve">Approve</button>
    <button id="deny">Deny</button>
  </p>
  <form id="signin" hidden>
    <p class="muted">Sign in to continue.</p>
    <label>Email <input id="email" type="email" required></label>
    <label>Password <input id="password" type="password" required></label>
    <button>Sign in</button>
  </form>
  <p id="result" class="muted" hidden></p>
  <script>
    const base = '';
    let token = sessionStorage.getItem('polaris_access_token');
    let approval = null;
    const say = (text) => { const e = document.getElementById('result'); e.textContent = text; e.hidden = false; };
    const signin = document.getElementById('signin');
    signin.onsubmit = async (event) => {
      event.preventDefault();
      const response = await fetch(base + '/auth/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email: document.getElementById('email').value, password: document.getElementById('password').value }) });
      const body = await response.json();
      if (!response.ok || !body.data?.access_token) { say(body.message ?? 'Sign-in failed'); return; }
      token = body.data.access_token;
      sessionStorage.setItem('polaris_access_token', token);
      signin.hidden = true;
      start();
    };
    const decide = async (decision) => {
      const response = await fetch(base + '/agents/approvals/' + encodeURIComponent(approval.id) + '/decide', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token },
        body: JSON.stringify({ decision }),
      });
      const body = await response.json();
      if (!response.ok) { say(body.detail ?? body.error ?? 'Refused'); return; }
      document.getElementById('actions').hidden = true;
      say(decision === 'approve' ? 'Approved: the agent may now use ' + body.data.grants.map((grant) => grant.capability).join(', ') + '.' : 'Denied.');
    };
    const load = async (userCode) => {
      const response = await fetch(base + '/agents/approvals/code?user_code=' + encodeURIComponent(userCode), { headers: { Accept: 'application/json', Authorization: 'Bearer ' + token } });
      const body = await response.json();
      if (!response.ok) { say(body.detail ?? body.error ?? 'Unknown code'); return; }
      approval = body.data;
      document.getElementById('code').hidden = true;
      const agent = document.getElementById('agent');
      agent.textContent = approval.agent.name + ' (' + approval.agent.mode + ') asks for' + (approval.reason ? ' — ' + approval.reason : '') + ':';
      agent.hidden = false;
      for (const grant of approval.grants) {
        const item = document.createElement('li');
        item.textContent = grant.capability + (Object.keys(grant.constraints ?? {}).length ? ' with constraints ' + JSON.stringify(grant.constraints) : '');
        document.getElementById('grants').append(item);
      }
      document.getElementById('actions').hidden = false;
      document.getElementById('approve').onclick = () => decide('approve');
      document.getElementById('deny').onclick = () => decide('deny');
    };
    const start = () => (async () => {
      if (!token) { signin.hidden = false; return; }
      const given = new URLSearchParams(location.search).get('user_code');
      if (given) { await load(given); return; }
      const form = document.getElementById('code');
      form.hidden = false;
      form.onsubmit = (event) => { event.preventDefault(); load(document.getElementById('user_code').value.trim()).catch((error) => say(String(error))); };
    })().catch((error) => say(String(error)));
    start();
  </script>
</body>
</html>
