<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Connect a device</title>
  <style>
    body { font: 16px/1.5 system-ui, sans-serif; max-width: 32rem; margin: 3rem auto; padding: 0 1rem; color: #222; }
    input, button { font: inherit; padding: .5rem; }
    ul { padding-left: 1.25rem; }
    .muted { color: #666; }
  </style>
</head>
<body>
  <!--
    The reference device page of the OAuth provider (RFC 8628): the device shows a code and this URL;
    the signed-in user types the code, sees the device's client and scopes, and approves or refuses.
  -->
  <h1>Connect a device</h1>
  <form id="lookup">
    <label>Code <input id="code" name="user_code" placeholder="BCDF-GHJK" autocomplete="off" required></label>
    <button>Continue</button>
  </form>
  <p id="client" class="muted" hidden></p>
  <ul id="scopes"></ul>
  <p id="actions" hidden>
    <button id="approve">Allow</button>
    <button id="deny">Deny</button>
  </p>
  <form id="signin" hidden>
    <p class="muted">Sign in to continue.</p>
    <label>Email <input id="email" type="email" required></label>
    <label>Password <input id="password" type="password" required></label>
    <button>Sign in</button>
  </form>
  <p id="error" class="muted" hidden></p>
  <script>
    const base = '';
    let token = sessionStorage.getItem('polaris_access_token');
    const say = (text) => { const e = document.getElementById('error'); e.textContent = text; e.hidden = false; };
    const signin = document.getElementById('signin');
    signin.onsubmit = async (event) => {
      event.preventDefault();
      const response = await fetch(base + '/auth/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email: document.getElementById('email').value, password: document.getElementById('password').value }) });
      const body = await response.json();
      if (!response.ok || !body.data?.access_token) { say(body.message ?? 'Sign-in failed'); return; }
      token = body.data.access_token;
      sessionStorage.setItem('polaris_access_token', token);
      signin.hidden = true;
      start();
    };
    const code = document.getElementById('code');
    code.value = new URLSearchParams(location.search).get('user_code') ?? '';
    const decide = async (approve) => {
      const response = await fetch(base + '/oauth2/device/approve', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token },
        body: JSON.stringify({ user_code: code.value, approve }),
      });
      const body = await response.json();
      if (!response.ok) { say(body.detail ?? body.error ?? 'Refused'); return; }
      document.getElementById('actions').hidden = true;
      say(approve ? 'The device is connected; you can close this page.' : 'The device was refused.');
    };
    const start = () => { if (!token) { signin.hidden = false; } };
    document.getElementById('lookup').onsubmit = async (event) => {
      event.preventDefault();
      if (!token) { signin.hidden = false; return; }
      const response = await fetch(base + '/oauth2/device/verify?user_code=' + encodeURIComponent(code.value), { headers: { Authorization: 'Bearer ' + token } });
      const body = await response.json();
      if (!response.ok) { say(body.detail ?? body.error ?? 'Unknown code'); return; }
      const { client, scopes } = body.data;
      const shown = document.getElementById('client');
      shown.textContent = (client.name || client.client_id) + ' asks for:';
      shown.hidden = false;
      document.getElementById('scopes').replaceChildren(...scopes.map((scope) => { const item = document.createElement('li'); item.textContent = scope.description + ' (' + scope.name + ')'; return item; }));
      document.getElementById('actions').hidden = false;
      document.getElementById('approve').onclick = () => decide(true);
      document.getElementById('deny').onclick = () => decide(false);
    };
    start();
  </script>
</body>
</html>
